name: Run Test
on:
  push:
    branches:
      - main
jobs:
  verify_python_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.13"
      - name: Setup Python
        run: uv python install 3.13
      - name: Add Python 3.13 to PATH
        run: echo "$(dirname "$(uv python find 3.13)")" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: uv sync --no-build --frozen
      - name: Run tox
        run: uv run tox
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  sonar_scan:
    runs-on: ubuntu-latest
    needs: verify_python_tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
